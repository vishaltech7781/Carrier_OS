version: '3.8'

services:
  # Document Database (Users, Profiles, Resumes, Interviews, Activity)
  mongodb:
    image: mongo:7.0
    container_name: careeros-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Relational Database (Skills Taxonomy, Roles, Jobs, Applications, Roadmaps, DSA)
  mysql:
    image: mysql:8.0
    container_name: careeros-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: careeros_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Python AI/ML Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: careeros-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000

  # Node.js API Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careeros-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/careeros_ai
      - DATABASE_URL=mysql://root:root@mysql:3306/careeros_db
      - AI_SERVICE_URL=http://ai-service:8000/api/v1
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=careeros_super_secret_production_key_2026
    depends_on:
      - mongodb
      - mysql
      - ai-service

  # React Vite Frontend Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careeros-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  mysql_data:

